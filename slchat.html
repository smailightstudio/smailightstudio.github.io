<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>slchat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section id="login" class="card">
      <h1>🔐 SL Chat</h1>
      <input id="roomId" placeholder="房间 ID">
      <input id="roomPassword" type="password" placeholder="房间密码">
      <input id="nickname" maxlength="20" placeholder="你的昵称">
      <button id="joinBtn">进入房间（可能需要梯子）</button>
      <p id="loginStatus" class="status"></p>
    </section>

    <section id="chat" class="chat hidden">
      <header>
        <div>
          <h2 id="roomTitle"></h2>
          <small id="online"></small>
        </div>
        <button id="clearHistoryBtn" type="button">清除本机聊天记录</button>
        <button id="leaveBtn" class="secondary">退出</button>
      </header>

      <div class="layout">
        <aside>
          <h3>成员</h3>
          <ul id="members"></ul>
          <p id="ownerInfo"></p>
        </aside>

        <section class="chatPanel">
          <div id="messages" class="messages"></div>
          <div class="fileControls">
  <input id="fileInput" type="file" hidden>
  <button id="fileBtn" type="button" onclick="document.getElementById('fileInput').click()">📎 图片/文件</button>
  <span id="fileStatus"></span>
</div>
<form id="sendForm">
            <input id="messageInput" maxlength="1000" autocomplete="off" placeholder="输入消息…">
            <button>发送</button>
          </form>
        </section>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
